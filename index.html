<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML to PDF Studio Pro</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            },

              cyan: '#06b6d4',

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>

  <!-- HTML2PDF Library Bundle (html2canvas + jsPDF) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Estilização para ajustar o CodeMirror ao painel */
    .CodeMirror {
      height: 100% !important;
      font-family: 'Fira Code', 'Courier New', Courier, monospace;
      font-size: 13px;
      border-radius: 0.5rem;
    }
    
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;

</head>

      </button>
      <button onclick="loadTemplate('report')" class="px-3 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-md transition flex items-center gap-1.5">
        <i class="fa-solid fa-chart-pie text-cyan-400"></i> Relatório
      </button>
    </div>

    <!-- Ações de Saída -->
    <div class="flex items-center gap-2">
      <button onclick="printNative()" title="Usar diálogo de impressão do navegador" class="px-3.5 py-2 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg transition flex items-center gap-2">
        <i class="fa-solid fa-print"></i>
        <span class="hidden md:inline">Imprimir</span>

      </div>

      <!-- Barra do Editor (Ações rápidas do código) -->

    </section>

    // Inicialização da Página e do Editor
    window.onload = function() {
      // Inicializa o CodeMirror
      editor = CodeMirror.fromTextArea(document.getElementById("codeEditor"), {
        mode: "htmlmixed",
        theme: "dracula",
        lineNumbers: true,
        autoCloseTags: true,
        lineWrapping: true
      });

      // Carrega o template padrão de Currículo
      editor.setValue(TEMPLATES.curriculum);

      // Evento de alteração com debounce para renderização
      editor.on("change", () => {
        if (document.getElementById("autoPreview").checked) {
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(updatePreview, 500);
        }
      });

      // Renderiza primeiro preview
      updatePreview();
    };

    // Atualiza a visualização no iframe
    function updatePreview() {
      const status = document.getElementById("renderingStatus");
      status.classList.remove("hidden");

      const code = editor.getValue();
      const iframe = document.getElementById("previewIframe");
      const wrapper = document.getElementById("paperWrapper");

      // Obter dimensões e estilos do papel selecionado
      const size = document.getElementById("pageSize").value;
      const orientation = document.getElementById("pageOrientation").value;

      // Definir tamanho aproximado para preview visual
      let width = "210mm";
      let height = "297mm";

      if (size === "letter") { width = "216mm"; height = "279mm"; }
      if (size === "legal") { width = "216mm"; height = "356mm"; }
      if (size === "a3") { width = "297mm"; height = "420mm"; }

      if (orientation === "landscape") {
        const temp = width;
        width = height;
        height = temp;
      }

      wrapper.style.width = width;
      wrapper.style.minHeight = height;

      // Injetar código no iframe sandbox de pré-visualização
      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
      iframeDoc.open();
      iframeDoc.write(code);
      iframeDoc.close();

      setTimeout(() => {
        status.classList.add("hidden");
      }, 300);
    }

    function forceUpdatePreview() {
      updatePreview();
      showToast("Preview atualizado com sucesso!");
    }

    // Carregar Template
    function loadTemplate(key) {
      if (TEMPLATES[key]) {
        editor.setValue(TEMPLATES[key]);
        updatePreview();
        showToast(`Template de ${key.toUpperCase()} carregado!`);
      }
    }

    // Gerar e Baixar PDF usando html2pdf.js
    function generatePDF() {
      const downloadBtn = document.getElementById("downloadBtn");
      const originalText = downloadBtn.innerHTML;

      // Feedback de carregamento no botão
      downloadBtn.disabled = true;
      downloadBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>Gerando PDF...</span>`;

      // Criar elemento invisível para a renderização limpa do PDF
      const code = editor.getValue();
      const element = document.createElement('div');
      element.innerHTML = code;
      document.body.appendChild(element);

      // Opções do html2pdf
      const size = document.getElementById("pageSize").value;
      const orientation = document.getElementById("pageOrientation").value;
      const margin = parseInt(document.getElementById("pageMargin").value, 10);
      const filename = document.getElementById("filename").value || 'documento.pdf';

      const opt = {
        margin: margin,
        filename: filename,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, logging: false },
        jsPDF: { unit: 'mm', format: size, orientation: orientation }
      };

      // Executa conversão
      html2pdf().set(opt).from(element).save().then(() => {
        document.body.removeChild(element);
        downloadBtn.disabled = false;
        downloadBtn.innerHTML = originalText;
        showToast("PDF baixado com sucesso!");
      }).catch(err => {
        console.error("Erro ao gerar PDF:", err);
        document.body.removeChild(element);
        downloadBtn.disabled = false;
        downloadBtn.innerHTML = originalText;
        showToast("Erro ao gerar PDF. Verifique o código.", true);
      });
    }

    // Impressão Nativa (Garante suporte completo a vetores e textos nativos)
    function printNative() {
      const iframe = document.getElementById("previewIframe");
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
    }

    // Utilitários do Editor
    function copyCode() {
      const code = editor.getValue();
      navigator.clipboard.writeText(code).then(() => {
        showToast("Código copiado para a área de transferência!");
      });
    }

    function clearCode() {
      if (confirm("Tem certeza que deseja limpar o editor?")) {
        editor.setValue("");
        updatePreview();
        showToast("Editor limpo.");
      }
    }

    // Exibir notificações Toast
    function showToast(message, isError = false) {
      const toast = document.getElementById("toast");
      const toastMsg = document.getElementById("toastMsg");
      const toastIcon = document.getElementById("toastIcon");

      toastMsg.innerText = message;

      if (isError) {
        toastIcon.className = "fa-solid fa-triangle-exclamation text-rose-400";
      } else {
        toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
      }

      toast.classList.remove("translate-y-20", "opacity-0");

      setTimeout(() => {
        toast.classList.add("translate-y-20", "opacity-0");
      }, 3000);
    }
  </script>
</body>
</html>
