<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor HTML para PDF</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #f0f6fc;
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 450px;
      background-color: #161b22;
      color: #00ff66;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #00ff66;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #00ff66;
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: #00cc52;
    }

    button:active {
      transform: scale(0.99);
    }

    /* O container de renderização agora fica invisível apenas por opacidade e z-index */
    #pdf-render {
      position: fixed;
      top: 0;
      left: 0;
      width: 210mm; /* Largura padrão A4 */
      min-height: 297mm;
      background-color: #ffffff;
      color: #000000;
      opacity: 0;
      pointer-events: none;
      z-index: -9999;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Conversor HTML para PDF</h1>
    <textarea id="html-input" placeholder="Cole seu código HTML aqui..."></textarea>
    <button id="btn-gerar" onclick="gerarPDF()">Gerar PDF</button>
  </div>

  <div id="pdf-render"></div>

  <script>
    async function gerarPDF() {
      const input = document.getElementById('html-input').value;
      if (!input.trim()) return;

      const btn = document.getElementById('btn-gerar');
      btn.innerText = "Gerando PDF...";
      btn.disabled = true;

      const renderArea = document.getElementById('pdf-render');
      renderArea.innerHTML = input;

      // Espera 500ms para garantir que o DOM e estilos internos sejam processados
      await new Promise(resolve => setTimeout(resolve, 500));

      const opt = {
        margin:       10,
        filename:     'documento.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { 
          scale: 2, 
          useCORS: true, 
          logging: false,
          scrollX: 0,
          scrollY: 0
        },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      try {
        await html2pdf().set(opt).from(renderArea).save();
      } catch (err) {
        console.error("Erro ao gerar PDF:", err);
      } finally {
        renderArea.innerHTML = '';
        btn.innerText = "Gerar PDF";
        btn.disabled = false;
      }
    }
  </script>

</body>
</html>
