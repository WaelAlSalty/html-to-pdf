<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor HTML para PDF</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #f0f6fc;
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 480px;
      background-color: #161b22;
      color: #00ff66;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #00ff66;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #00ff66;
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: #00cc52;
    }

    button:active {
      transform: scale(0.99);
    }

    /* Iframe oculto usado para processar o HTML completo e gerar a impressão/PDF */
    #print-frame {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Conversor HTML para PDF</h1>
    <textarea id="html-input" placeholder="Cole seu código HTML aqui..."></textarea>
    <button onclick="gerarPDF()">Gerar PDF</button>
  </div>

  <iframe id="print-frame"></iframe>

  <script>
    // Código de amostra pronto para exibição e teste imediato
    const amostraHTML = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      color: #333;
    }
    h1 {
      color: #0066cc;
      border-bottom: 2px solid #0066cc;
      padding-bottom: 8px;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
    }
    .card {
      background-color: #f4f4f4;
      border-left: 4px solid #00ff66;
      padding: 15px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Amostra de Documento PDF</h1>
  <p>Este é um exemplo de documento renderizado diretamente de um código HTML completo.</p>
  
  <div class="card">
    <strong>Status da Renderização:</strong> OK!<br>
    Suporta CSS embutido, tags <html>, <head>, <body> e formatação completa.
  </div>
</body>
</html>`;

    // Preenche o textarea com a amostra ao carregar
    document.getElementById('html-input').value = amostraHTML;

    function gerarPDF() {
      const input = document.getElementById('html-input').value;
      if (!input.trim()) return;

      const iframe = document.getElementById('print-frame');
      const iframeDoc = iframe.contentWindow || iframe.contentDocument;
      
      const doc = iframeDoc.document || iframeDoc;
      doc.open();
      doc.write(input);
      doc.close();

      // Aguarda 250ms para garantir que o CSS do iframe seja aplicado antes de disparar a impressão
      setTimeout(() => {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
      }, 250);
    }
  </script>

</body>
</html>
